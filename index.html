<!doctype html>
<html lang="en" class="dark font-sans subpixel-antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Bakari Mustafa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallbacks; the 16px art drops the lens barrel, which cannot hold its gap at that size. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>ATO Lens</title>
    <meta name="description" content="Local-first Australian tax, income, super and HELP history workspace." />
    <meta name="theme-color" content="#0a0a0a" />
    <style>
      /* Initial loading screen - paints before Tailwind and React load. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0a0a0a;
        color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-app-region: drag;
      }
      #initial-loader .mark {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #initial-loader .spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #34d399;
        animation: initial-loader-spin 0.7s linear infinite;
      }
      #initial-loader .status {
        font-size: 12px;
        color: #71717a;
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="m-0 min-h-screen bg-[#0a0a0a] text-white">
    <div id="root">
      <!-- Replaced automatically once React mounts <App /> into #root. -->
      <div id="initial-loader">
        <div class="mark">
          <span>ATO Lens</span>
        </div>
        <div class="spinner"></div>
        <div class="status">Loading your local tax workspace…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
